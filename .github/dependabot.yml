version: 2
updates:
  # Actions are pinned by commit; this is what keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # The types follow the oldest Node.js the plugin supports (package.json
      # engines), not the newest: newer types would let code compile that a
      # supported Node.js cannot run.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
