version: 2
updates:
  # Actions are pinned by commit; this is what keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    groups:
      dependencies:
        patterns: ["*"]
